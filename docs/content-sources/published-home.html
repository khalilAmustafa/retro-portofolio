 helps students choose a specialization, follow prerequisite-based learning paths, and prepare for target career roles.</li><li><strong>VisionPulse AI</strong> – Educational decision-support prototype that maps financial news and macroeconomic events into AI-generated asset reaction predictions using Google Gemini.</li><li><strong>Abyss of the Loss</strong> – 2D psychological horror game built in Godot with exploration, story progression, interactive environments, and atmospheric visuals.</li></ul><h2>Experience</h2><p><strong>IT / AI Team Member</strong> – MENA ORG (May 2026 to Present, Jordan / Remote). Contributing to backend and cloud foundations for organization web systems, AI-powered feature design, deployment workflows, and technical feasibility research.</p><h2>Education</h2><ul><li><strong>BSc Computer Science</strong> – Applied Science Private University, Amman, Jordan. Third-year student, GPA 87/100, expected graduation 2027.</li><li><strong>Erasmus Exchange</strong> – Universitat Politècnica de València, Spain (2025–2026), Informatics Engineering.</li></ul><h2>Certifications</h2><ul><li>AWS Certified Cloud Practitioner (Amazon Web Services, expires May 2029)</li><li>IBM Data Science Professional Certificate (Coursera / IBM Skills Network, 8/12 courses completed)</li></ul><h2>Open to Opportunities</h2><p>Open to software engineering internships, backend roles, mobile development opportunities, and AI/product-focused technical projects.</p><h2>Contact</h2><ul><li>Email:<!-- --> <a href="mailto:khalil.asad.2005@gmail.com">khalil.asad.2005@gmail.com</a></li><li>GitHub:<!-- --> <a href="https://github.com/khalilAmustafa">github.com/khalilAmustafa</a></li><li>LinkedIn:<!-- --> <a href="https://linkedin.com/in/khalil-mustafa-7722382b0">linkedin.com/in/khalil-mustafa-7722382b0</a></li><li>Portfolio:<!-- --> <a href="https://khalils.codes">khalils.codes</a></li></ul></article></noscript><script src="/_next/static/chunks/0dhbjz-xsmu83.js" id="_R_" async=""></scri
